<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">

<style>
:root{--bg:#0b0f14;--card:#131a22;--card2:#1a232d;--bd:#243040;--tx:#e6edf3;--mu:#8b98a5;--am:#f0a500;--ok:#3fb950;--cr:#f85149;--in:#58a6ff;--nav:64px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
.mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
section{display:none}section.on{display:block}
h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:20px 2px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1c2733,#131a22);border:1px solid var(--bd);border-radius:20px;padding:16px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#243040 0)}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:15px}
.hero .t{font-weight:700;font-size:16px}.hero .s{color:var(--mu);font-size:12.5px;margin-top:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{border-radius:16px;padding:14px;border:1px solid var(--bd);background:var(--card);text-align:left;color:var(--tx);font:inherit;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.kpi .n{font-size:30px;font-weight:800;line-height:1.1;color:var(--c)}.kpi .l{font-size:12px;color:var(--mu);margin-top:2px}
.urg{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--bd)}.urg:last-child{border:0}
.urg .d{flex:1;min-width:0;font-size:13.5px}.urg .d small{display:block;color:var(--mu);font-size:11.5px}
.bar{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:inherit;padding:8px 0}
.bar .r{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}.bar .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:7px;border-radius:4px;background:#243040;margin-top:5px;overflow:hidden}.bar i u{display:block;height:100%;background:var(--cr);border-radius:4px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 8px;margin:-14px -14px 4px;padding:12px 14px 8px}
.srch{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);padding:12px 14px;font-size:16px;outline:0}
.srch:focus{border-color:var(--am)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:7px 13px;font:600 13px system-ui;white-space:nowrap}
.chip.on{background:var(--am);border-color:var(--am);color:#000}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--mu)}
.row2 select{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;font-size:14px}
.catx{background:#2a2110;color:var(--am);border:1px solid #5a4410;border-radius:20px;padding:4px 10px;font-size:12px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;padding:12px;margin-top:9px}
.p.done{opacity:.5}.p .m{flex:1;min-width:0}
.p .nm{font-weight:600;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .sb{color:var(--mu);font-size:11.5px;margin-top:2px}
.p .st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px}
.p .st div{background:var(--card2);border-radius:8px;padding:5px 6px;text-align:center}
.p .st b{display:block;font-size:13px}.p .st small{font-size:10px;color:var(--mu);text-transform:uppercase}
.cob{text-align:right;flex:none;min-width:64px;color:var(--c)}.cob b{font-size:24px;display:block;line-height:1.05}.cob small{font-size:10.5px;color:var(--mu)}
.chk{margin-top:8px;width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:none;color:#000;font-size:18px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.btn{display:block;width:100%;background:var(--am);color:#000;border:0;border-radius:14px;padding:14px;font:700 15px system-ui;text-align:center;margin-top:10px}
.btn.o{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ln{font-size:13px;color:var(--mu);margin-top:6px}.ln b{color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(11,15,20,.92);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;height:var(--nav);background:none;border:0;color:var(--mu);font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--am)}nav svg{width:23px;height:23px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}#sheet.on{display:flex}
#sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
#sheet h3{font-size:17px;margin-bottom:4px}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}.kv span:first-child{color:var(--mu)}.kv span:last-child{text-align:right}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1c2733;border:1px solid var(--am);border-radius:12px;padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 28px)}#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;background:rgba(11,15,20,.85);display:none;place-items:center;z-index:70;color:var(--am);font-weight:600}#load.on{display:grid}
#nav button{position:relative}.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--cr);color:#fff;border-radius:10px;font:700 10px system-ui;padding:1px 6px;min-width:17px;text-align:center}
.pban{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:#2a2110;border:1px solid #5a4410;border-radius:16px;padding:12px 14px;margin-bottom:12px}.pban b{color:var(--am)}.pban small{display:block;color:var(--mu);font-size:12px}
.pban.now{animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(240,165,0,.18)}}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.acts .chk{margin:0}
.cart{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:none;font-size:15px}.cart.on{border-color:var(--am);background:#2a2110}
.pi{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px;margin-top:9px}.pi.done{opacity:.45}.pi.done .nm{text-decoration:line-through}
.pi .m{flex:1;min-width:0}.pi .nm{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pi .sb{color:var(--mu);font-size:11.5px;margin-top:2px}
.qty{width:62px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:9px 6px;font-size:16px;text-align:center}
.dch{display:inline-block;margin-top:5px;border:1px solid var(--bd);background:var(--card2);color:var(--am);border-radius:12px;padding:3px 9px;font:600 11.5px system-ui}
.rm{background:none;border:0;color:var(--mu);font-size:18px;padding:6px}
.pr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--bd);font-size:13.5px}.pr small{color:var(--mu);display:block;font-size:11.5px}.pr b{color:var(--am);font-size:20px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 0;font-size:13px;font-weight:700}.gh small{display:block;color:var(--mu);font-weight:400;font-size:11.5px;margin-top:1px}.gh button{background:none;border:1px solid var(--bd);color:var(--cr);border-radius:10px;padding:6px 10px;font:600 12px system-ui}
input[type=file],[hidden]{display:none!important}
</style></head><body>
<main>
<section id="s-home" class="on">
 <div id="pban"></div>
 <div class="hero"><div class="ring" id="ring"><b id="ringn">0%</b></div><div><div class="t" id="h-fil">Sem dados</div><div class="s" id="h-sub">Abra a aba Dados para carregar o relatório</div></div></div>

</section>
<section id="s-prod">
 <div class="sticky"><input class="srch" id="q" placeholder="Buscar descrição, EAN ou código" type="search">

</section>
<section id="s-data">

 <div class="card"><b>Planograma</b><div class="ln" id="d-plano">Nenhum relatório carregado</div>
  <label class="btn" for="f-plano">Escolher arquivo (.txt ou .json)</label><input type="file" id="f-plano" accept=".txt,.json">
  <div style="height:16px"></div><b>Trânsito</b><div class="ln" id="d-trans">Não carregado</div>
  <label class="btn o" for="f-trans">Escolher relatório de Trânsito</label><input type="file" id="f-trans" accept=".txt"></div>
 <h2>Nuvem</h2>
 <div class="card"><div class="kv" style="padding-top:0"><span>🔑 Código</span><span><b id="d-code">não definido</b></span></div>

  <button class="btn o" id="b-up">⬆ Enviar para a nuvem</button></div>
 <h2>Arquivos e progresso</h2>
 <div class="card"><div class="btns" style="margin-top:0"><button class="btn o" id="b-json" style="margin:0">Backup .json</button><button class="btn o" id="b-csv" style="margin:0">Exportar .csv</button></div>
  <button class="btn o" id="b-clear">Zerar itens concluídos</button></div>

</main>
<nav><div id="nav">
 <button data-s="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Resumo</button>
 <button data-s="prod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Produtos</button>
 <button data-s="ped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h3l2.4 10.5a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L20 8H7"/></svg>Pedido<span class="badge" id="pbadge" style="display:none">0</span></button>
 <button data-s="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 1 0 5 14.5"/><path d="m9 15 3-3 3 3M12 12v8"/></svg>Dados</button>
</div></nav>
<div id="sheet"><div id="sheetc"></div></div><div id="toast"></div><div id="load">Carregando…</div>
<script>
/* ═══ DADOS (leitura dos relatórios, memória do navegador) ═══ */
const COLS = [
  { key:'st',         start:0,   end:2   },
  { key:'automacao',  start:3,   end:16  },
  { key:'produto',    start:17,  end:25  },
  { key:'descricao',  start:26,  end:66  },
  { key:'emb',        start:66,  end:72  },  // widened to catch right-aligned values
  { key:'referencia', start:72,  end:87  },
  { key:'fornec',     start:88,  end:96  },
  { key:'nome',       start:97,  end:119 },
  { key:'sist',       start:120, end:124 },
  { key:'giro',       start:125, end:129 },
  { key:'corredor',   start:130, end:138 },
  { key:'altura',     start:139, end:146 },
  { key:'largura',    start:147, end:154 },
  { key:'prof',       start:155, end:162 },
  { key:'total',      start:163, end:170 },
  { key:'cobplan',    start:171, end:179 },
  { key:'qtdestoque', start:180, end:191 },
  { key:'pbl',        start:192, end:195 },
  // Virtual columns — populated from the transit report when loaded
  { key:'qt_transito',  start:0, end:0, virtual:true },
  { key:'total_geral',  start:0, end:0, virtual:true },
  { key:'mdv',          start:0, end:0, virtual:true },
  { key:'cob_total',    start:0, end:0, virtual:true },
];
let transitMap = {};   // { produto_code → { qt_transito, estoque_transito } }
let transitLoaded = false;

/* Parse the transit .txt report and build a lookup map keyed by produto code */
function parseTransitFile(text) {
  const RE_DATA = /^[A-Z] \d{8}/;
  const map = {};
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\r$/, '');
    if (!RE_DATA.test(line)) continue;
    const produto    = line.substring(2, 10).trim();
    // pt-BR: "1.234,50" → remove o ponto de milhar e troca a vírgula por ponto
    const num = str => parseFloat((str || '0').trim().replace(/\./g, '').replace(',', '.')) || 0;
    // Lê pelo padrão do texto (Sist, Estoque, MDV, Cobert, Cl, Qt.Trânsito, Ped.Pend)
    // — acentos/caracteres especiais na descrição deslocam as colunas fixas.
    const m = /\s\d{2}\s+(-?[\d.]*,\d{2})\s+(\d+)\s+(\d+)\s+[A-Z]{1,2}\s+(-?[\d.]*,\d{2})\s+(-?[\d.]*,\d{2})/
              .exec(line.substring(45));
    let estoque, mdv, cobert, qt_transit;
    if (m) {
      estoque = num(m[1]); mdv = num(m[2]); cobert = num(m[3]); qt_transit = num(m[4]);
    } else {                                   // fallback: posições fixas
      qt_transit = num(line.substring(105, 116));
      estoque    = num(line.substring(73,  85));
      mdv        = num(line.substring(85,  91));
      cobert     = num(line.substring(91,  99));
    }
    // MDV = estoque ÷ cobertura (cobertura = dias para vender o estoque).
    // Só usa o MDV do relatório (arredondado p/ inteiro) quando não dá para calcular.
    let mdvDerivado = false;
    if (cobert > 0 && estoque > 0) { mdv = estoque / cobert; mdvDerivado = true; }
    map[produto] = { qt_transito: qt_transit, mdv, mdvDerivado };
  }
  return map;
}
const IDB_NAME    = 'PlanogramaDB';
const IDB_VERSION = 1;
const IDB_STORE   = 'files';

let idb = null; // will hold the opened IDBDatabase

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(IDB_STORE, { keyPath:'id' });
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror   = e => reject(e.target.error);
  });
}

function idbSave(record) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  });
}

function idbGet(id) {
  return new Promise((resolve, reject) => {
    const tx  = idb.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = e => resolve(e.target.result || null);
    req.onerror   = e => reject(e.target.error);
  });
}

function idbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  });
}
let lsKey  = 'planograma_done_default';
let doneSet = new Set();

function lsKeyFor(filial, date) {
  const slug = (filial + '_' + date).replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
  return 'planograma_done_' + (slug || 'default');
}

function lsLoad()  {
  try { doneSet = new Set(JSON.parse(localStorage.getItem(lsKey) || '[]')); }
  catch { doneSet = new Set(); }
}
function lsSave()  {
  try { localStorage.setItem(lsKey, JSON.stringify([...doneSet])); } catch {}
}
function lsClear() {
  doneSet.clear();
  try { localStorage.removeItem(lsKey); } catch {}
}
const RE_CAT    = /^\s{2,}\d{2}\.\d{3}\.\d{3}\.\d{3}\s+(.+)/;
const RE_DATA   = /^([A-Z])\s{2}(\d{13})/;
const RE_DATE   = /Data:\s*([\d/]+)/;
const RE_FILIAL = /Filial:\s*(.+?)\s{3,}/;
const RE_HORA   = /Hora:\s*([\d:]+)/;

/* ────────────────────────────────────────────────────────
   PARSER
──────────────────────────────────────────────────────── */
function extractField(line, col) {
  if (line.length <= col.start) return '';
  return (line.substring(col.start, col.end) || '').trim();
}

function parseLine(line) {
  const row = {};
  for (const col of COLS) row[col.key] = extractField(line, col);
  return row;
}

function parseFile(text) {
  const lines = text.split(/\r?\n/);
  const records = [];
  let currentCat = '';
  let metaDate = '', metaFilial = '', metaHora = '';

  for (const line of lines) {
    if (!metaDate)   { const m = RE_DATE.exec(line);   if (m) metaDate   = m[1]; }
    if (!metaHora)   { const m = RE_HORA.exec(line);   if (m) metaHora   = m[1]; }
    if (!metaFilial) {
      const m = RE_FILIAL.exec(line);
      if (m) metaFilial = m[1].replace(/CONDOR SUPER CENTER LTDA\.\s*/i,'').trim();
    }
    const catM = RE_CAT.exec(line);
    if (catM) { currentCat = catM[1].trim(); continue; }
    if (RE_DATA.test(line)) {
      const row = parseLine(line);
      row.categoria = currentCat;
      ['corredor','altura','largura','prof','total','cobplan','qtdestoque'].forEach(k => {
        if (row[k]) row[k] = row[k].replace(/_+/g,'').trim();
      });
      records.push(row);
    }
  }
  return { records, meta:{ date:metaDate, filial:metaFilial, hora:metaHora } };
}
let allRecords=[];
function getMDV(r) {
  // MDV = capacidade do planograma (altura × largura × profundidade) ÷ Cob.Plan
  // — a Cob.Plan do relatório é calculada sobre a capacidade, não sobre o estoque.
  const num = v => parseFloat(String(v || '0').replace(/\./g, '').replace(',', '.')) || 0;
  let cap = num(r.total);                                   // coluna Total = alt × larg × prof
  if (cap <= 0) cap = num(r.altura) * num(r.largura) * num(r.prof);
  const cob = parseFloat((r.cobplan || '0').replace(/\./g, '').replace(/[^0-9]/g, '')) || 0;
  if (cap <= 0 || cob <= 0 || cob === 999) return null;
  return cap / cob;
}
function downloadBlob(blob, filename) {

  const a   = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=allRecords.map(r=>[r.produto,r.automacao,r.descricao,r.categoria,r.corredor,r._e,r._t,r._m?r._m.toFixed(2).replace('.',','):'',r.cobplan,r._c===null?'':r._c.toFixed(1).replace('.',','),LBL[r._k],r._d?'sim':'']);
 downloadBlob(new Blob(['\ufeff'+[H,...rows].map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'planograma.csv')};

/* NUVEM (Firebase Realtime Database via REST) */
const FB='https://planograma-48711-default-rtdb.firebaseio.com',LSC='planograma_sync_code';
const code=()=>{try{return localStorage.getItem(LSC)||''}catch{return ''}};
function askCode(){const raw=prompt('Invente um código de sincronização (mín. 8 caracteres: letras, números, @ ! * + = ~ _ -). Use o MESMO nos dois aparelhos:',code());if(raw===null)return '';
 const c=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_@!*+=~-]/g,'').slice(0,64);
 if(c.length<8){toast(`Código com ${c.length} caractere(s) — precisa de 8 ou mais`);return ''}localStorage.setItem(LSC,c);toast('Código salvo: '+c);return c}
const cu=(c,l)=>`${FB}/planograma/${encodeURIComponent(c)}/${l}.json`;
async function cf(url,o){let r;try{r=await fetch(url,o)}catch{throw Error('Sem conexão com a nuvem')}
 if(r.status===401||r.status===403)throw Error('Sem permissão — confira as regras do Firebase');if(!r.ok)throw Error('Erro da nuvem ('+r.status+')');return r}
async function cloudInfo(){const c=code(),el=$('d-cloud');$('b-down').hidden=true;$('d-code').textContent=c||'não definido';
 if(!c){el.textContent='Informe um código para enviar e baixar dados entre aparelhos.';return}
 el.textContent='Verificando…';try{const i=await(await cf(cu(c,'info'))).json();
  if(!i){el.innerHTML='Nada na nuvem com este código ainda.';return}
  el.innerHTML=`<b>✓ Tem dados na nuvem</b><br>${esc(i.filial||'')} · ${esc(i.date||'')} · ${f0(i.total)} produtos${i.hasTransit?' · Trânsito ✓':''}<br>Enviado em ${new Date(i.exportedAt).toLocaleString('pt-BR')}`;$('b-down').hidden=false}
 catch(e){el.textContent=e.message}}
$('b-code').onclick=()=>{if(askCode())cloudInfo()};
$('b-up').onclick=async()=>{if(!allRecords.length)return toast('Nada para enviar');const c=code()||askCode();if(!c)return;
 try{const b=buildBackup(),p=JSON.stringify(b);if(p.length>9e6)throw Error('Dados grandes demais para a nuvem');busy(true,'Enviando…');
  const put=(l,v)=>cf(cu(c,l),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
  await put('data',p);await put('info',{exportedAt:b.exportedAt,name:b.name,filial:currentMeta.filial||'',date:currentMeta.date||'',total:b.records.length,hasTransit:!!b.transit});
  busy(false);toast('Enviado para a nuvem');cloudInfo()}catch(e){busy(false);toast(e.message)}};
$('b-down').onclick=async()=>{const c=code();if(!c)return;busy(true,'Baixando…');
 try{const s=await(await cf(cu(c,'data'))).json();if(typeof s!=='string')throw Error('Nada encontrado na nuvem');await importBackup(s,'nuvem')}catch(e){busy(false);toast(e.message)}};

savePed();
/* INÍCIO: abre sozinho o que estiver salvo neste aparelho */
(async()=>{try{await idbOpen();const s=await idbGet('current');
 if(s&&s.records){await loadRecords(s.records,s.meta||{},s.name,s.transit||null,false,s.savedAt);return}}catch{}
 go('data')})();
/* PWA: service worker (funciona offline depois da 1ª abertura) */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
