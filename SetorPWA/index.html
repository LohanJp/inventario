<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Escala de Promotores</title>
<meta name="theme-color" content="#16a34a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Escala" />
<style>
  :root{
    --green:#16a34a; --green-dark:#0f7a37; --green-soft:#e7f7ee;
    --amber:#d97706; --amber-soft:#fef3e2;
    --bg:#f0f2f5; --card:#ffffff; --ink:#0f1115; --muted:#6b7280;
    --danger:#e5484d; --danger-soft:#fdeaea; --line:#e9eaee;
    --radius-lg:22px; --radius-md:16px; --radius-sm:12px;
    --shadow: 0 1px 2px rgba(15,17,21,0.04), 0 8px 20px -12px rgba(15,17,21,0.12);
    --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); font-family:var(--font-body); color:var(--ink); -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  #app{ max-width:460px; margin:0 auto; min-height:100vh; position:relative; display:flex; flex-direction:column; background:var(--bg); }
  .status-spacer{ height: env(safe-area-inset-top, 0px); }
  .page{ flex:1; padding:20px 18px 100px; animation:fadein .18s ease; }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  h1.page-title{ font-family:var(--font-display); font-weight:800; font-size:32px; letter-spacing:-0.02em; margin:6px 0 20px; }
  .title-row{ display:flex; align-items:center; justify-content:space-between; }
  .fab{ width:44px; height:44px; border-radius:14px; background:var(--green); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:var(--shadow); cursor:pointer; transition: transform .12s ease; }
  .fab:active{ transform:scale(0.92); }

  .card{ background:var(--card); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow); margin-bottom:12px; }

  .setor-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; cursor:pointer; }
  .setor-block{ border-bottom:1px solid var(--line); }
  .setor-block:last-child{ border-bottom:none; }
  .setor-name{ font-weight:700; font-size:16px; }
  .setor-sub{ color:var(--muted); font-size:13px; margin-top:2px; }
  .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:middle; }
  .dot.ok{ background:var(--green); }
  .dot.atencao{ background:var(--amber); }
  .dot.critico{ background:var(--danger); }
  .count-badge{ padding:7px 14px; border-radius:999px; font-size:14px; font-weight:800; font-family:var(--font-display); white-space:nowrap; }
  .count-badge.ok{ background:var(--green-soft); color:var(--green-dark); }
  .count-badge.atencao{ background:var(--amber-soft); color:var(--amber); }
  .count-badge.critico{ background:var(--danger-soft); color:var(--danger); }
  .setor-people{ padding:0 4px 16px; }
  .setor-people .empty-mini{ color:var(--muted); font-size:13px; padding:4px 0 6px; }
  .person-chip{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--bg); border-radius:12px; margin-bottom:6px; font-size:14px; font-weight:600; }
  .person-chip:last-child{ margin-bottom:0; }
  .edit-hint{ text-align:center; color:var(--muted); font-size:12px; margin-top:2px; }

  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .list-item:last-child{ border-bottom:none; }
  .li-name{ font-weight:700; font-size:16px; }
  .li-sub{ color:var(--muted); font-size:13.5px; margin-top:2px; }
  .wa-btn{ width:38px; height:38px; border-radius:50%; background:#e9f9ee; border:none; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex-shrink:0; }
  .wa-btn:active{ background:#d7f2e0; }

  .empty-state{ text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; }
  .empty-state .em-icon{ font-size:38px; margin-bottom:10px; display:block; }

  .search{ width:100%; padding:14px 16px; border-radius:999px; border:none; background:#e6e8ec; font-size:15px; font-family:var(--font-body); margin-bottom:14px; }
  .search:focus{ outline:2px solid var(--green); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-weight:700; font-size:14px; margin-bottom:8px; }
  .field input[type=text], .field input[type=tel], .field input[type=number], .field textarea, .field select{
    width:100%; padding:14px 16px; border-radius:16px; border:1.5px solid var(--line);
    font-size:15px; font-family:var(--font-body); background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:70px; line-height:1.4; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--green); }
  .hint{ color:var(--muted); font-size:12.5px; margin-top:6px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }

  .day-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .day-chip{ padding:10px 0; width:44px; text-align:center; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; }
  .day-chip.active{ background:var(--green); border-color:var(--green); color:#fff; }

  .btn-block{ width:100%; padding:16px; border:none; border-radius:16px; background:var(--green); color:#fff; font-weight:700; font-size:16px; cursor:pointer; margin-top:6px; }
  .btn-block:active{ background:var(--green-dark); }
  .btn-block.wa{ background:#25D366; }
  .btn-block.secondary{ background:var(--bg); color:var(--ink); }
  .btn-block.danger-outline{ background:var(--danger-soft); color:var(--danger); margin-top:10px; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(15,17,21,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:fadein2 .15s ease; }
  @keyframes fadein2{ from{opacity:0;} to{opacity:1;} }
  .sheet{ width:100%; max-width:460px; background:#fff; border-radius:24px 24px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto; animation:slideup .22s cubic-bezier(.2,.8,.2,1); position:relative; }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:40px; height:5px; background:var(--line); border-radius:99px; margin:0 auto 16px; }
  .sheet-title{ font-family:var(--font-display); font-weight:800; font-size:22px; margin-bottom:18px; }
  .sheet-close{ position:absolute; top:18px; right:18px; background:#f0f2f5; border:none; width:34px; height:34px; border-radius:50%; font-size:16px; color:var(--muted); cursor:pointer; }

  .toast{ position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#1c1f26; color:#fff; padding:12px 20px; border-radius:14px;
    font-size:14px; font-weight:600; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:90%; text-align:center; animation:toastin .18s ease; }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  nav.tabbar{ position:sticky; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px -14px rgba(0,0,0,.25); z-index:20; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:8px 2px; border-radius:14px;
    color:#8a8f98; font-size:11px; font-family:var(--font-body); font-weight:600; cursor:pointer; }
  .tab.active{ color:var(--green); background:var(--green-soft); }
  .tab.disabled{ opacity:.4; }

  .dev-note{ background:var(--amber-soft); color:var(--amber); border-radius:16px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:14px; }

  /* Missão */
  .mission-card{ padding:16px; margin-bottom:12px; }
  .mission-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .mission-title{ font-weight:800; font-family:var(--font-display); font-size:16px; }
  .mission-setor{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .mission-obs{ font-size:14px; color:var(--ink); margin-top:8px; line-height:1.4; }
  .mission-photo{ width:100%; border-radius:14px; margin-top:10px; display:block; max-height:220px; object-fit:cover; }
  .mission-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .time-left{ font-size:12.5px; font-weight:700; color:var(--amber); }
  .time-left.urgent{ color:var(--danger); }
  .badge-done{ background:var(--green-soft); color:var(--green-dark); padding:5px 12px; border-radius:999px; font-size:12px; font-weight:800; }
  .photo-preview{ width:100%; border-radius:16px; margin-top:8px; max-height:220px; object-fit:cover; display:block; }
  .photo-input-btn{ width:100%; padding:14px; border-radius:16px; border:1.5px dashed var(--line); background:#fff; color:var(--muted); font-weight:600; font-size:14px; cursor:pointer; text-align:center; }

  .lightbox{ position:fixed; inset:0; background:#000; z-index:200; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
  .lightbox img{ width:100%; height:100%; object-fit:contain; will-change:transform; user-select:none; -webkit-user-drag:none; transform-origin:center center; }
  .lightbox-close{ position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); right:18px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:18px; z-index:201; }
  .lightbox-hint{ position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:rgba(255,255,255,0.6); font-size:12.5px; z-index:201; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   STORAGE
   ========================================================= */
const STORAGE_KEY = "setores_teste_data_v1";

function safeLocalStorage(){
  try{ const t="__t__"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); return window.localStorage; }
  catch(e){ return null; }
}
const LS = safeLocalStorage();
let memoryFallback = null;

function loadData(){
  const raw = LS ? LS.getItem(STORAGE_KEY) : memoryFallback;
  let data = { setores: [], promotores: [], missoes: [], pedidos: [] };
  if(raw){ try{ data = Object.assign(data, JSON.parse(raw)); }catch(e){} }
  if(!data.promotores) data.promotores = [];
  if(!data.missoes) data.missoes = [];
  if(!data.pedidos) data.pedidos = [];
  data.setores.forEach(s=> delete s._testCount);
  return data;
}
function saveData(){
  const raw = JSON.stringify(state);
  if(LS){ try{ LS.setItem(STORAGE_KEY, raw); }catch(e){ memoryFallback = raw; } }
  else{ memoryFallback = raw; }
}

let state = loadData();
let ui = { page:"home", sheet:null, sheetData:null, promotorSearch:"", expandedSetorId:null, escalaDia:null, lightbox:null };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let toastTimer=null, toastEl=null;
function toast(msg){
  if(toastEl) toastEl.remove();
  if(toastTimer) clearTimeout(toastTimer);
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); toastEl=el;
  toastTimer = setTimeout(()=>{ el.remove(); if(toastEl===el) toastEl=null; }, 2200);
}

/* =========================================================
   DIAS / WHATSAPP
   ========================================================= */
const DIAS = [
  {id:"dom", label:"D"}, {id:"seg", label:"S"}, {id:"ter", label:"T"}, {id:"qua", label:"Q"},
  {id:"qui", label:"Q"}, {id:"sex", label:"S"}, {id:"sab", label:"S"}
];
const DIAS_FULL = {dom:"Dom", seg:"Seg", ter:"Ter", qua:"Qua", qui:"Qui", sex:"Sex", sab:"Sáb"};
function todayDiaId(){ return DIAS[new Date().getDay()].id; }

function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
function formatPhoneDisplay(digits){
  const d = digitsOnly(digits);
  if(d.length <= 2) return d;
  if(d.length <= 6) return "("+d.slice(0,2)+") "+d.slice(2);
  if(d.length <= 10) return "("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);
  return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7,11);
}
function waLink(phoneDigits){
  let p = digitsOnly(phoneDigits);
  if(p.length <= 11) p = "55" + p;
  return "https://wa.me/"+p;
}

/* =========================================================
   IDENTIFICAÇÃO DE PRODUTO NA FOTO (Google Gemini)
   ⚠️ IMPORTANTE: troque o valor abaixo pela SUA chave, criada em
   https://aistudio.google.com/apikey — e restrinja essa chave
   (no Google Cloud Console) para funcionar somente no domínio:
   https://lohanjp.github.io/inventario/SetorPWA/
   ========================================================= */
const GEMINI_API_KEY = "COLOQUE_SUA_CHAVE_AQUI";

async function identificarProdutoNaFoto(dataUrlJpeg){
  if(!GEMINI_API_KEY || GEMINI_API_KEY === "COLOQUE_SUA_CHAVE_AQUI") return "";
  try{
    const base64 = dataUrlJpeg.split(",")[1];
    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "Essa é uma foto de um produto de supermercado que precisa ser reposto ou pedido. Responda em português, em poucas palavras, no formato 'Reposição de <produto>' incluindo marca e tamanho/quantidade se der pra ver na embalagem. Se não conseguir identificar o produto, responda apenas 'Reposição de item'. Não escreva mais nada além dessa frase." },
              { inline_data: { mime_type: "image/jpeg", data: base64 } }
            ]
          }]
        })
      }
    );
    if(!resp.ok) return "";
    const json = await resp.json();
    const texto = json?.candidates?.[0]?.content?.parts?.[0]?.text || "";
    return texto.trim().replace(/^["']|["']$/g, "");
  }catch(e){
    return "";
  }
}
function compressImage(file, maxWidth=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   SETORES — contagem e lista de quem está lá hoje
   ========================================================= */
function promotoresHojePorSetor(setorId){
  const hoje = todayDiaId();
  return state.promotores.filter(p => p.setorId===setorId && (p.dias||[]).includes(hoje));
}
function statusForSetor(setor){
  const count = promotoresHojePorSetor(setor.id).length;
  if(count < setor.minAtencao) return "critico";
  if(count < setor.minOk) return "atencao";
  return "ok";
}

/* =========================================================
   MISSÕES — expira sozinha depois de 24h
   ========================================================= */
function limparMissoesExpiradas(){
  const agora = Date.now();
  const antes = state.missoes.length;
  state.missoes = state.missoes.filter(m => (agora - m.criadoEm) < 24*60*60*1000);
  if(state.missoes.length !== antes) saveData();
}
function tempoRestante(m){
  const restanteMs = (m.criadoEm + 24*60*60*1000) - Date.now();
  if(restanteMs <= 0) return {texto:"Expirando…", urgente:true};
  const h = Math.floor(restanteMs/3600000);
  const min = Math.floor((restanteMs%3600000)/60000);
  return { texto: h>0 ? `${h}h ${min}min restantes` : `${min}min restantes`, urgente: h<2 };
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  limparMissoesExpiradas();
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="status-spacer"></div>
    <div class="page">${renderPage()}</div>
    ${renderTabbar()}
    ${ui.sheet ? renderSheet() : ""}
    ${ui.lightbox ? renderLightbox() : ""}
  `;
  bindEvents();
  if(ui.lightbox) setupLightboxGestures();
}

function renderLightbox(){
  const [tipo, itemId] = ui.lightbox.split(":");
  const colecao = tipo==="pedido" ? state.pedidos : state.missoes;
  const m = colecao.find(x=>x.id===itemId);
  if(!m || !m.foto) return "";
  return `
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" data-action="fechar-foto">✕</button>
      <img id="lightbox-img" src="${m.foto}" />
      <div class="lightbox-hint">Beliscar para dar zoom · toque duas vezes</div>
    </div>
  `;
}

function setupLightboxGestures(){
  const box = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  if(!box || !img) return;

  let scale = 1, tx = 0, ty = 0;
  let startDist = 0, startScale = 1;
  let startX = 0, startY = 0, startTx = 0, startTy = 0;
  let lastTap = 0;
  let panning = false;

  function apply(){
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function dist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx,dy);
  }

  box.addEventListener("touchstart", (e)=>{
    if(e.touches.length===2){
      startDist = dist(e.touches);
      startScale = scale;
      panning = false;
    } else if(e.touches.length===1){
      const now = Date.now();
      if(now - lastTap < 300){
        // double tap: toggle zoom
        if(scale > 1){ scale = 1; tx = 0; ty = 0; } else { scale = 2.5; }
        apply();
        lastTap = 0;
        return;
      }
      lastTap = now;
      panning = scale > 1;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = tx; startTy = ty;
    }
  }, {passive:true});

  box.addEventListener("touchmove", (e)=>{
    if(e.touches.length===2){
      e.preventDefault();
      const d = dist(e.touches);
      scale = Math.min(4, Math.max(1, startScale * (d/startDist)));
      apply();
    } else if(e.touches.length===1 && panning){
      e.preventDefault();
      tx = startTx + (e.touches[0].clientX - startX);
      ty = startTy + (e.touches[0].clientY - startY);
      apply();
    }
  }, {passive:false});

  box.addEventListener("touchend", (e)=>{
    if(scale <= 1){ scale = 1; tx = 0; ty = 0; apply(); }
    panning = false;
  });
}

function renderTabbar(){
  const tabs = [
    {id:"home", label:"Início"},
    {id:"setores", label:"Setores"},
    {id:"promotores", label:"Promotores"},
    {id:"pedidos", label:"Pedidos"},
    {id:"missoes", label:"Missão"},
    {id:"escala", label:"Escala"},
  ];
  return `<nav class="tabbar">
    ${tabs.map(t => `
      <button class="tab ${ui.page===t.id?'active':''}" data-nav="${t.id}">
        <span>${t.label}</span>
      </button>
    `).join("")}
  </nav>`;
}

function renderPage(){
  switch(ui.page){
    case "home": return renderHome();
    case "setores": return renderSetores();
    case "promotores": return renderPromotores();
    case "missoes": return renderMissoes();
    case "pedidos": return renderPedidos();
    case "escala": return renderEscala();
    default: return "";
  }
}

/* =========================================================
   HOME — resumo do dia
   ========================================================= */
function renderHome(){
  const totalHoje = state.promotores.filter(p => (p.dias||[]).includes(todayDiaId())).length;
  const contagemStatus = { ok:0, atencao:0, critico:0 };
  state.setores.forEach(s => { contagemStatus[statusForSetor(s)]++; });
  const missoesAbertas = state.missoes.filter(m=>!m.concluida).length;
  const diaLabel = DIAS_FULL[todayDiaId()];

  return `
    <h1 class="page-title">Hoje · ${diaLabel}</h1>
    <div class="card">
      <div class="setor-sub" style="margin-bottom:4px;">Promotores trabalhando hoje</div>
      <div style="font-family:var(--font-display); font-weight:800; font-size:36px;">${totalHoje}</div>
    </div>
    <div class="card">
      <div class="setor-sub" style="margin-bottom:12px;">Setores por status</div>
      <div class="setor-row" style="padding:8px 0;"><div class="setor-name"><span class="dot ok"></span>Ok</div><div class="count-badge ok">${contagemStatus.ok}</div></div>
      <div class="setor-row" style="padding:8px 0;"><div class="setor-name"><span class="dot atencao"></span>Atenção</div><div class="count-badge atencao">${contagemStatus.atencao}</div></div>
      <div class="setor-row" style="padding:8px 0;"><div class="setor-name"><span class="dot critico"></span>Crítico</div><div class="count-badge critico">${contagemStatus.critico}</div></div>
    </div>

/* =========================================================
   ESCALA — visão por dia da semana
   ========================================================= */
function renderEscala(){
  const diaAtivo = ui.escalaDia || todayDiaId();
  const doDia = state.promotores.filter(p => (p.dias||[]).includes(diaAtivo)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

  const grupos = {};
  doDia.forEach(p=>{
    const chave = p.setorId ? (state.setores.find(s=>s.id===p.setorId)?.nome || "Sem setor") : "Sem setor";
    if(!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(p);
  });
  const setoresOrdenados = Object.keys(grupos).sort((a,b)=> a==="Sem setor" ? 1 : b==="Sem setor" ? -1 : a.localeCompare(b,'pt-BR'));

  return `
    <h1 class="page-title">Escala</h1>
    <div class="day-chips" style="margin-bottom:16px;">
      ${DIAS.map(d => `<button type="button" class="day-chip ${diaAtivo===d.id?'active':''}" data-escala-dia="${d.id}">${d.label}</button>`).join("")}
    </div>
    ${doDia.length===0 ? `
      <div class="card"><div class="empty-state"><span class="em-icon">🗓️</span>Ninguém escalado em ${DIAS_FULL[diaAtivo]}.</div></div>
    ` : setoresOrdenados.map(nomeSetor => `
      <div class="card">
        <div class="setor-sub" style="margin-bottom:10px; font-weight:700; color:var(--ink);">${escapeHtml(nomeSetor)}</div>
        ${grupos[nomeSetor].map(p=>`<div class="person-chip">${escapeHtml(p.nome)}</div>`).join("")}
      </div>
    `).join("")}
  `;
}

function escapeHtml(str){ return (str||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

function openSheet(name, data){ ui.sheet = name; ui.sheetData = data; render(); }
function closeSheet(){ ui.sheet = null; ui.sheetData = null; render(); }

let selectedDays = [];
let missaoFotoData = "";
let pedidoFotoData = "";

function bindEvents(){
  const searchEl = document.getElementById("promotor-search");
  if(searchEl){
    searchEl.addEventListener("input", (e)=>{ ui.promotorSearch = e.target.value; render(); setTimeout(()=>{ const el=document.getElementById("promotor-search"); if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } },0); });
  }
  const chips = document.getElementById("day-chips");
  if(chips){
    const p = ui.sheet==="promotor" && ui.sheetData ? state.promotores.find(x=>x.id===ui.sheetData) : null;
    selectedDays = p ? [...(p.dias||[])] : (ui.sheetData===null ? selectedDays : []);
    chips.querySelectorAll(".day-chip").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const d = btn.dataset.day;
        const idx = selectedDays.indexOf(d);
        if(idx>=0) selectedDays.splice(idx,1); else selectedDays.push(d);
        btn.classList.toggle("active");
      });
    });
  }
  const fotoInput = document.getElementById("f-mfoto");
  const fotoBtn = document.getElementById("f-mfoto-btn");
  if(fotoInput && fotoBtn){
    fotoBtn.addEventListener("click", ()=> fotoInput.click());
    fotoInput.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById("f-mfoto-preview");
      fotoBtn.textContent = "📷 Processando...";
      compressImage(file).then(async (dataUrl)=>{
        missaoFotoData = dataUrl;
        preview.src = missaoFotoData;
        preview.style.display = "block";
        fotoBtn.textContent = "🔎 Identificando produto...";
        const titulo = await identificarProdutoNaFoto(dataUrl);
        fotoBtn.textContent = "📷 Trocar foto";
        const tituloInput = document.getElementById("f-mtitulo");
        if(titulo && tituloInput && !tituloInput.value.trim()){
          tituloInput.value = titulo;
        }
      }).catch(()=>{
        toast("Não foi possível processar a foto.");
        fotoBtn.textContent = "📷 Tirar ou escolher foto";
      });
    });
  }
  const pfotoInput = document.getElementById("f-pfoto");
  const pfotoBtn = document.getElementById("f-pfoto-btn");
  if(pfotoInput && pfotoBtn){
    pfotoBtn.addEventListener("click", ()=> pfotoInput.click());
    pfotoInput.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById("f-pfoto-preview");
      pfotoBtn.textContent = "📷 Processando...";
      compressImage(file).then(async (dataUrl)=>{
        pedidoFotoData = dataUrl;
        preview.src = pedidoFotoData;
        preview.style.display = "block";
        pfotoBtn.textContent = "🔎 Identificando produto...";
        const titulo = await identificarProdutoNaFoto(dataUrl);
        pfotoBtn.textContent = "📷 Trocar foto";
        const tituloInput = document.getElementById("f-ptitulo");
        if(titulo && tituloInput && !tituloInput.value.trim()){
          tituloInput.value = titulo;
        }
      }).catch(()=>{
        toast("Não foi possível processar a foto.");
        pfotoBtn.textContent = "📷 Tirar ou escolher foto";
      });
    });
  }
}

function handleAction(action, id){
  if(action==="novo-setor"){ openSheet("setor", null); }
  else if(action==="editar-setor"){ openSheet("setor", id); }
  else if(action==="toggle-setor"){ ui.expandedSetorId = ui.expandedSetorId===id ? null : id; render(); }
  else if(action==="close-sheet"){ closeSheet(); }
  else if(action==="save-setor"){
    const nome = document.getElementById("f-nome").value.trim();
    const minAtencao = parseInt(document.getElementById("f-atencao").value) || 0;
    const minOk = parseInt(document.getElementById("f-ok").value) || 0;
    if(!nome){ toast("Informe o nome do setor."); return; }
    if(minOk < minAtencao){ toast("O mínimo para Ok deve ser maior ou igual ao de Atenção."); return; }
    if(id){
      const s = state.setores.find(x=>x.id===id);
      s.nome = nome; s.minAtencao = minAtencao; s.minOk = minOk;
    } else {
      state.setores.push({ id: uid(), nome, minAtencao, minOk });
    }
    saveData(); closeSheet(); toast("Setor salvo.");
  }
  else if(action==="delete-setor"){
    if(confirm("Excluir este setor? Promotores ligados a ele ficarão sem setor.")){
      state.setores = state.setores.filter(s=>s.id!==id);
      state.promotores.forEach(p=>{ if(p.setorId===id) p.setorId=""; });
      saveData(); closeSheet(); toast("Setor excluído.");
    }
  }
  else if(action==="novo-promotor"){
    if(state.setores.length===0){ toast("Cadastre um setor primeiro."); return; }
    selectedDays = [];
    openSheet("promotor", null);
  }
  else if(action==="editar-promotor"){
    const p = state.promotores.find(x=>x.id===id);
    selectedDays = p ? [...(p.dias||[])] : [];
    openSheet("promotor", id);
  }
  else if(action==="save-promotor"){
    const nome = document.getElementById("f-pnome").value.trim();
    const telefone = document.getElementById("f-ptel").value.trim();
    const setorId = document.getElementById("f-psetor").value;
    const observacao = document.getElementById("f-pobs").value.trim();
    if(!nome){ toast("Informe o nome."); return; }
    if(id){
      const p = state.promotores.find(x=>x.id===id);
      p.nome=nome; p.telefone=telefone; p.setorId=setorId; p.observacao=observacao; p.dias=[...selectedDays];
    } else {
      state.promotores.push({ id: uid(), nome, telefone, setorId, observacao, dias:[...selectedDays] });
    }
    saveData(); closeSheet(); toast("Promotor salvo.");
  }
  else if(action==="delete-promotor"){
    if(confirm("Excluir este promotor?")){
      state.promotores = state.promotores.filter(p=>p.id!==id);
      saveData(); closeSheet(); toast("Promotor excluído.");
    }
  }
  else if(action==="wa-promotor"){
    const p = state.promotores.find(x=>x.id===id);
    if(p && p.telefone) window.open(waLink(p.telefone), "_blank");
  }
  else if(action==="nova-missao"){
    missaoFotoData = "";
    openSheet("missao", null);
  }
  else if(action==="save-missao"){
    const titulo = document.getElementById("f-mtitulo").value.trim();
    const setorId = document.getElementById("f-msetor").value;
    const observacao = document.getElementById("f-mobs").value.trim();
    state.missoes.push({
      id: uid(), titulo, setorId, observacao, foto: missaoFotoData,
      criadoEm: Date.now(), concluida: false
    });
    saveData(); closeSheet(); toast("Missão criada.");
    ui.page = "missoes"; render();
  }
  else if(action==="concluir-missao"){
    const m = state.missoes.find(x=>x.id===id);
    if(m){ m.concluida = true; m.foto = ""; saveData(); render(); toast("Missão concluída."); }
  }
  else if(action==="excluir-missao"){
    if(confirm("Excluir esta missão?")){
      state.missoes = state.missoes.filter(m=>m.id!==id);
      saveData();
      if(ui.sheet==="missao-detalhe") closeSheet(); else render();
    }
  }
  else if(action==="ver-missao"){
    openSheet("missao-detalhe", id);
  }
  else if(action==="ir-missoes"){
    ui.page = "missoes"; render();
  }
  else if(action==="ver-foto"){
    ui.lightbox = "missao:"+id; render();
  }
  else if(action==="ver-foto-pedido"){
    ui.lightbox = "pedido:"+id; render();
  }
  else if(action==="fechar-foto"){
    ui.lightbox = null; render();
  }
  else if(action==="novo-pedido"){
    pedidoFotoData = "";
    openSheet("pedido", null);
  }
  else if(action==="ver-pedido"){
    openSheet("pedido-detalhe", id);
  }
  else if(action==="save-pedido"){
    const titulo = document.getElementById("f-ptitulo").value.trim();
    const observacao = document.getElementById("f-pobs2").value.trim();
    state.pedidos.push({ id: uid(), titulo, observacao, foto: pedidoFotoData, criadoEm: Date.now() });
    saveData(); closeSheet(); toast("Pedido salvo.");
    ui.page = "pedidos"; render();
  }
  else if(action==="concluir-pedido"){
    state.pedidos = state.pedidos.filter(p=>p.id!==id);
    saveData();
    if(ui.sheet==="pedido-detalhe") closeSheet(); else render();
    toast("Pedido marcado como feito.");
  }
  else if(action==="cancelar-pedido"){
    if(confirm("Cancelar este pedido?")){
      state.pedidos = state.pedidos.filter(p=>p.id!==id);
      saveData();
      if(ui.sheet==="pedido-detalhe") closeSheet(); else render();
    }
  }
}

/* Delegação de eventos: um único listener fixo cuida de todos os cliques,
   em vez de recriar addEventListener a cada render (mais leve). */
document.addEventListener("click", (e)=>{
  const actionEl = e.target.closest("[data-action]");
  if(actionEl){
    const isBackdropClose = actionEl.classList.contains("sheet-backdrop");
    const clickedInsideSheet = !!e.target.closest(".sheet");
    if(!(isBackdropClose && clickedInsideSheet)){
      handleAction(actionEl.dataset.action, actionEl.dataset.id, e);
    }
    return;
  }
  const navEl = e.target.closest("[data-nav]");
  if(navEl){ ui.page = navEl.dataset.nav; render(); return; }
  const diaEl = e.target.closest("[data-escala-dia]");
  if(diaEl){ ui.escalaDia = diaEl.dataset.escalaDia; render(); }
});

render();
setInterval(()=>{ if((ui.page==="missoes"||ui.page==="home") && !ui.sheet) render(); }, 60000);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
